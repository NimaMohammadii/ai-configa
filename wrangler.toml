name = "ai-configa"
main = "src/worker-youtube.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["enable_request_signal", "request_signal_passthrough", "nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
# Meta webhook verification value. This is intentionally a plain Worker variable, not a secret.
INSTAGRAM_WEBHOOK_VERIFY_TOKEN = "vexa_ig_webhook_3rDsP4q2v4t0mE8Dt1OAb2mFsd1QY8wF"

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Secrets are not written here. Set them with:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put ELEVEN_API

[[d1_databases]]
binding = "DB"
database_name = "ai-configa-db"
database_id = "33c8cf30-4daa-498a-8706-d457869f5d25"

[[r2_buckets]]
binding = "EXPLORE_MEDIA"
bucket_name = "ai-configa-explore-media"

[browser]
binding = "BROWSER"

[[workflows]]
name = "vexa-ai-coding-tasks"
binding = "AI_CODING_WORKFLOW"
class_name = "AiCodingWorkflow"

[[workflows]]
name = "vexa-subtitle-downloads"
binding = "VEXA_SUBTITLE_WORKFLOW"
class_name = "VexaSubtitleWorkflow"

# Vexa media container. Pinned image includes yt-dlp 2026.08.19, Deno and FFmpeg.
# Basic is used for headroom during YouTube JS challenge solving; idle instances sleep quickly.
[[containers]]
class_name = "VexaMediaContainerV3"
image = "docker.io/friedrichrehren/yt-dlp:2026.08.19"
max_instances = 2000
instance_type = "basic"

# Isolated Instagram downloader. It uses the same pinned yt-dlp runtime without sharing provider code/state.
[[containers]]
class_name = "VexaInstagramContainer"
image = "docker.io/friedrichrehren/yt-dlp:2026.08.19"
max_instances = 2000
instance_type = "basic"

# Isolated Story/Highlight runtime inherits the Instagram downloader implementation.
[[containers]]
class_name = "VexaInstagramStoryContainer"
image = "docker.io/friedrichrehren/yt-dlp:2026.08.19"
max_instances = 800
instance_type = "basic"

# Aparat is intentionally isolated from YouTube/PornHub and Instagram code/state.
[[containers]]
class_name = "VexaAparatContainer"
image = "docker.io/friedrichrehren/yt-dlp:2026.08.19"
max_instances = 200
instance_type = "basic"

# Realtime subtitle audio containers. Download burn-in rendering is isolated below
# so a retry or a busy live subtitle session cannot consume the other workload's slots.
[[containers]]
class_name = "VexaSubtitleContainer"
image = "./Dockerfile.vexa-subtitles"
max_instances = 400
instance_type = "basic"

# Fixed three-instance pool for burned-in subtitle downloads. Requests are routed
# only across these stable instances instead of creating one container per session.
[[containers]]
class_name = "VexaDownloadSubtitleContainer"
image = "./Dockerfile.vexa-subtitles"
max_instances = 400
instance_type = "basic"

[[durable_objects.bindings]]
name = "VEXA_MEDIA"
class_name = "VexaMediaContainerV3"

[[durable_objects.bindings]]
name = "VEXA_INSTAGRAM"
class_name = "VexaInstagramContainer"

[[durable_objects.bindings]]
name = "VEXA_INSTAGRAM_PROGRESS"
class_name = "VexaInstagramProgressHub"

[[durable_objects.bindings]]
name = "VEXA_INSTAGRAM_STORY"
class_name = "VexaInstagramStoryContainer"

[[durable_objects.bindings]]
name = "VEXA_INSTAGRAM_STORY_PROGRESS"
class_name = "VexaInstagramStoryProgressHub"

[[durable_objects.bindings]]
name = "VEXA_APARAT"
class_name = "VexaAparatContainer"

[[durable_objects.bindings]]
name = "VEXA_APARAT_PROGRESS"
class_name = "VexaAparatProgressHub"

[[durable_objects.bindings]]
name = "VEXA_SUBTITLES"
class_name = "VexaSubtitleContainer"

[[durable_objects.bindings]]
name = "VEXA_DOWNLOAD_SUBTITLES"
class_name = "VexaDownloadSubtitleContainer"

[[durable_objects.bindings]]
name = "VEXA_DOWNLOAD_PROGRESS"
class_name = "VexaDownloadProgressHub"

# Preserve the complete Durable Object migration history that Cloudflare has
# already applied to the published Worker.
[[migrations]]
tag = "vexa-media-container-v1"
new_sqlite_classes = ["VexaMediaContainer"]

[[migrations]]
tag = "vexa-media-container-disabled-v2"
deleted_classes = ["VexaMediaContainer"]

# This migration was previously published when the paid media container was
# briefly re-enabled. It must remain in history even though that runtime was retired.
[[migrations]]
tag = "vexa-media-container-v3"
new_sqlite_classes = ["VexaMediaContainerV2"]

[[migrations]]
tag = "vexa-media-container-disabled-v4"
deleted_classes = ["VexaMediaContainerV2"]

# Use a new class name after the prior container namespaces were deleted.
[[migrations]]
tag = "vexa-media-container-v5"
new_sqlite_classes = ["VexaMediaContainerV3"]

[[migrations]]
tag = "vexa-subtitle-container-v1"
new_sqlite_classes = ["VexaSubtitleContainer"]

[[migrations]]
tag = "vexa-download-progress-hub-v1"
new_sqlite_classes = ["VexaDownloadProgressHub"]

[[migrations]]
tag = "vexa-instagram-container-v1"
new_sqlite_classes = ["VexaInstagramContainer"]

[[migrations]]
tag = "vexa-instagram-progress-hub-v1"
new_sqlite_classes = ["VexaInstagramProgressHub"]

[[migrations]]
tag = "vexa-instagram-story-container-v1"
new_sqlite_classes = ["VexaInstagramStoryContainer"]

[[migrations]]
tag = "vexa-instagram-story-progress-hub-v1"
new_sqlite_classes = ["VexaInstagramStoryProgressHub"]

[[migrations]]
tag = "vexa-download-subtitle-container-v1"
new_sqlite_classes = ["VexaDownloadSubtitleContainer"]

[[migrations]]
tag = "vexa-aparat-container-v1"
new_sqlite_classes = ["VexaAparatContainer"]

[[migrations]]
tag = "vexa-aparat-progress-hub-v1"
new_sqlite_classes = ["VexaAparatProgressHub"]

[triggers]
crons = ["* * * * *"]