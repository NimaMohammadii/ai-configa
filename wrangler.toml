name = "ai-configa"
main = "src/worker-voice.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["enable_request_signal", "request_signal_passthrough", "nodejs_compat"]
workers_dev = true
preview_urls = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Secrets are not written here. Set them with:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put ELEVEN_API

[[d1_databases]]
binding = "DB"
database_name = "ai-configa-db"
database_id = "33c8cf30-4daa-498a-8706-d457869f5d25"

[[r2_buckets]]
binding = "EXPLORE_MEDIA"
bucket_name = "ai-configa-explore-media"

[browser]
binding = "BROWSER"

[[workflows]]
name = "vexa-ai-coding-tasks"
binding = "AI_CODING_WORKFLOW"
class_name = "AiCodingWorkflow"

# Historical Durable Object migration. Keep this entry so Cloudflare can
# apply the follow-up deletion migration to the previously-created namespace.
[[migrations]]
tag = "vexa-media-container-v1"
new_sqlite_classes = ["VexaMediaContainer"]

# Vexa Media Container is temporarily disabled until Containers are enabled
# for this account. The binding, container image config, and class export stay
# removed; this migration retires the old Durable Object namespace cleanly.
[[migrations]]
tag = "vexa-media-container-disabled-v2"
deleted_classes = ["VexaMediaContainer"]

[triggers]
crons = ["* * * * *"]
