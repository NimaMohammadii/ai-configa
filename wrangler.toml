name = "ai-configa"
main = "src/worker-live-events.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["enable_request_signal", "request_signal_passthrough", "nodejs_compat"]
workers_dev = true
preview_urls = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Secrets are not written here. Set them with:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put ELEVEN_API

[[d1_databases]]
binding = "DB"
database_name = "ai-configa-db"
database_id = "33c8cf30-4daa-498a-8706-d457869f5d25"

[[r2_buckets]]
binding = "EXPLORE_MEDIA"
bucket_name = "ai-configa-explore-media"

[browser]
binding = "BROWSER"

[[workflows]]
name = "vexa-ai-coding-tasks"
binding = "AI_CODING_WORKFLOW"
class_name = "AiCodingWorkflow"

# Preserve the complete Durable Object migration history that Cloudflare has
# already applied to the published Worker. Containers remain disabled.
[[migrations]]
tag = "vexa-media-container-v1"
new_sqlite_classes = ["VexaMediaContainer"]

[[migrations]]
tag = "vexa-media-container-disabled-v2"
deleted_classes = ["VexaMediaContainer"]

# This migration was previously published when the paid media container was
# briefly re-enabled. It must remain in history even though the runtime is off.
[[migrations]]
tag = "vexa-media-container-v3"
new_sqlite_classes = ["VexaMediaContainerV2"]

# Retire the V2 Durable Object namespace so free-plan deployments no longer
# need to export VexaMediaContainerV2 or configure a Containers binding.
[[migrations]]
tag = "vexa-media-container-disabled-v4"
deleted_classes = ["VexaMediaContainerV2"]

[triggers]
crons = ["* * * * *"]
