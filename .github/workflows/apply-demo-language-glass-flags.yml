name: Apply demo language glass flags fix

on:
  pull_request_target:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/demo-language-glass-flags'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/demo-language-glass-flags
          fetch-depth: 0

      - name: Apply exact patch
        run: python3 .github/patch_demo_language_glass_flags.py

      - name: Validate
        run: |
          node --check src/mini-app/client.js
          npm test

      - name: Commit exact fix
        run: |
          rm -f .github/workflows/patch-demo-language-glass-flags.yml
          rm -f .github/patch_demo_language_glass_flags.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mini-app/client.js .github/workflows/patch-demo-language-glass-flags.yml .github/patch_demo_language_glass_flags.py
          git diff --cached --check
          git commit -m "Match demo language picker glass style"
          git push origin HEAD:fix/demo-language-glass-flags

      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup-main
          fetch-depth: 0

      - name: Remove temporary workflow
        working-directory: cleanup-main
        run: |
          rm -f .github/workflows/apply-demo-language-glass-flags.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-demo-language-glass-flags.yml
          git diff --cached --check
          git commit -m "Remove temporary language picker workflow"
          git push origin HEAD:main
