name: Apply purchase UI patch

on:
  push:
    paths:
      - .github/workflows/zz-purchase-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply focused source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {label} match, found {count}')
              write(path, text.replace(old, new, 1))

          def insert_before_nth(path, marker, block, occurrence, label):
              text = read(path)
              start = -1
              cursor = 0
              for _ in range(occurrence):
                  start = text.find(marker, cursor)
                  if start < 0:
                      raise SystemExit(f'{path}: missing {label} occurrence {occurrence}')
                  cursor = start + len(marker)
              write(path, text[:start] + block + text[start:])

          # Admin: a dedicated Payment Hero Images screen, reusing the existing Telegram-photo media storage.
          replace_once(
              'src/admin.js',
              '      [{ text: "🔐 Mini App Access", callback_data: "admin_mini_app_access" }, { text: "🖼 Mini App Icons", callback_data: "admin_mini_app_icons" }],\n',
              '      [{ text: "🔐 Mini App Access", callback_data: "admin_mini_app_access" }, { text: "🖼 Mini App Icons", callback_data: "admin_mini_app_icons" }],\n      [{ text: "🖼 Payment Hero Images", callback_data: "admin_payment_hero_images" }],\n',
              'admin main payment hero row',
          )

          old_targets = '''const MINI_APP_ICON_TARGETS = [
            { key: "history", label: "History button" },
            { key: "emotions", label: "Emotions button" },
            { key: "image_mode", label: "Create image mode icon" },
            { key: "voice_mode", label: "Text to voice mode icon" },
            { key: "image_generate", label: "Generate image button" },
          ];
          '''.replace('          ', '')
          new_targets = old_targets + '''
const PAYMENT_HERO_TARGETS = [
  { key: "hero_toman", label: "Toman checkout header" },
  { key: "hero_card", label: "Bank Card checkout header" },
];

export async function adminPaymentHeroImagesText(env) {
  const media = await getMiniAppButtonIcons(env);
  return [
    "🖼 <b>Payment Hero Images</b>",
    "",
    "Upload the two header images used on the Buy Credits page.",
    "They use the same full-width hero layout as Telegram Stars.",
    "",
    "Toman: <b>" + (media.hero_toman?.fileId ? "Configured" : "Not uploaded") + "</b>",
    "Bank Card: <b>" + (media.hero_card?.fileId ? "Configured" : "Not uploaded") + "</b>",
  ].join("\\n");
}

export function adminPaymentHeroImagesKeyboard() {
  return { inline_keyboard: [
    [{ text: "Upload Toman header", callback_data: "admin_payment_hero_upload:hero_toman" }, { text: "Delete", callback_data: "admin_payment_hero_delete:hero_toman" }],
    [{ text: "Upload Bank Card header", callback_data: "admin_payment_hero_upload:hero_card" }, { text: "Delete", callback_data: "admin_payment_hero_delete:hero_card" }],
    [{ text: "← Back", callback_data: "admin_main" }],
  ] };
}

export function adminPaymentHeroImagePromptText(iconKey = "hero_toman") {
  const target = miniAppIconTarget(iconKey);
  return [
    "🖼 <b>Upload Payment Hero Image</b>",
    "",
    "Target: <b>" + escapeHtml(target.label) + "</b>",
    "Send one photo now.",
    "It will replace the current header image for this payment method."
  ].join("\\n");
}
'''
          replace_once('src/admin.js', old_targets, new_targets, 'payment hero targets')
          replace_once(
              'src/admin.js',
              '  for (const item of MINI_APP_ICON_TARGETS) {\n',
              '  for (const item of [...MINI_APP_ICON_TARGETS, ...PAYMENT_HERO_TARGETS]) {\n',
              'combined mini app media list',
          )
          replace_once(
              'src/admin.js',
              '  const target = MINI_APP_ICON_TARGETS.find((item) => item.key === key);\n  if (!target) throw new Error("Invalid mini app icon");\n',
              '  const target = [...MINI_APP_ICON_TARGETS, ...PAYMENT_HERO_TARGETS].find((item) => item.key === key);\n  if (!target) throw new Error("Invalid mini app media target");\n',
              'combined mini app media resolver',
          )

          # Bot: wire the new admin screen into the existing admin action/photo flow.
          replace_once(
              'src/bot.js',
              '  adminMiniAppIconPromptText,\n',
              '  adminMiniAppIconPromptText,\n  adminPaymentHeroImagesKeyboard,\n  adminPaymentHeroImagesText,\n  adminPaymentHeroImagePromptText,\n',
              'payment hero imports',
          )

          payment_menu_block = '''  if (data === "admin_payment_hero_images") {
    if (!(await isAdmin(env, userId))) return denyCallback(env, query.id, state);
    await clearAdminAction(env, userId);
    await answerCallback(env, query.id);
    await editCurrentMenu(env, chatId, userId, messageId, await adminPaymentHeroImagesText(env), adminPaymentHeroImagesKeyboard());
    return;
  }

'''
          insert_before_nth('src/bot.js', '  if (data === "admin_mini_app_icons") {', payment_menu_block, 1, 'payment hero menu callback')

          payment_callbacks = '''  if (data.startsWith("admin_payment_hero_upload:")) {
    if (!(await isAdmin(env, userId))) return denyCallback(env, query.id, state);
    const iconKey = data.slice("admin_payment_hero_upload:".length);
    await answerCallback(env, query.id);
    await setAdminAction(env, userId, "payment_hero_image", { targetUserId: iconKey, chatId, messageId });
    await editCurrentMenu(env, chatId, userId, messageId, adminPaymentHeroImagePromptText(iconKey), adminCancelKeyboard("admin_payment_hero_images"));
    return;
  }

  if (data.startsWith("admin_payment_hero_delete:")) {
    if (!(await isAdmin(env, userId))) return denyCallback(env, query.id, state);
    const iconKey = data.slice("admin_payment_hero_delete:".length);
    await deleteMiniAppButtonIcon(env, iconKey);
    await answerCallback(env, query.id, "Payment header deleted", false);
    await editCurrentMenu(env, chatId, userId, messageId, (await adminPaymentHeroImagesText(env)) + "\\n\\n🗑 Deleted header image.", adminPaymentHeroImagesKeyboard());
    return;
  }

'''
          insert_before_nth('src/bot.js', '  if (data.startsWith("admin_mini_app_icon_upload:")) {', payment_callbacks, 1, 'payment hero upload callbacks')

          payment_photo_handler = '''  if (action.action === "payment_hero_image") {
    const fileId = getLargestPhotoFileId(message);
    if (!fileId) return false;

    const iconKey = action.target_user_id || "hero_toman";
    await setMiniAppButtonIcon(env, iconKey, fileId);
    await deleteMessage(env, chatId, inputMessageId).catch(() => null);
    await clearAdminAction(env, adminId);
    await editCurrentMenu(env, action.chat_id || chatId, adminId, Number(action.message_id), (await adminPaymentHeroImagesText(env)) + "\\n\\n✅ Payment header updated.", adminPaymentHeroImagesKeyboard());
    return true;
  }

'''
          insert_before_nth('src/bot.js', '  if (action.action === "mini_app_icon") {', payment_photo_handler, 1, 'payment hero photo handler')

          payment_text_handler = '''  if (action.action === "payment_hero_image") {
    await editCurrentMenu(env, action.chat_id || chatId, adminId, Number(action.message_id), adminPaymentHeroImagePromptText(action.target_user_id || "hero_toman") + "\\n\\nPlease send a photo, not text.", adminCancelKeyboard("admin_payment_hero_images"));
    return true;
  }

'''
          insert_before_nth('src/bot.js', '  if (action.action === "mini_app_icon") {', payment_text_handler, 2, 'payment hero text handler')

          # Credits page: remove the descriptive header line for Stars/Toman and apply uploaded hero URLs.
          replace_once(
              'src/mini-app/html.js',
              '<div><span>TELEGRAM STARS</span><h2>Buy credits</h2><p>Top up instantly and keep creating.</p></div>',
              '<div><span>TELEGRAM STARS</span><h2>Buy credits</h2></div>',
              'credits header paragraph',
          )
          replace_once(
              'src/mini-app/html.js',
              '    .credits-page.toman-payment-active .credits-page-head{background:#000 url(\\"/mini-app/assets/toman-checkout-hero.png?v=20260812-3\\") center/cover no-repeat}\n    .credits-page.toman-payment-active .credits-page-head:before{z-index:0;background:linear-gradient(90deg,rgba(0,0,0,.98) 0%,rgba(0,0,0,.72) 36%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.28) 100%)}\n',
              '',
              'old inline Toman hero overrides',
          )

          old_apply_icons = "  function applyButtonIcons(icons){buttonIcons=icons||{};setButtonIcon('#historyButton',buttonIcons.history);setButtonIcon('#emotionButton .emotion-trigger-icon',buttonIcons.emotions);updateModeButtonIcon();setButtonIcon('#generateImageButton',buttonIcons.image_generate)}"
          new_apply_icons = "  function creditHeroCssUrl(url){return url?'url(\\\"'+String(url).replace(/\\\"/g,'%22')+'\\\")':''}\\n  function setCreditHeroImage(property,url){var page=q('creditsPage');if(!page)return;var value=creditHeroCssUrl(url);if(value)page.style.setProperty(property,value);else page.style.removeProperty(property)}\\n  function applyButtonIcons(icons){buttonIcons=icons||{};setButtonIcon('#historyButton',buttonIcons.history);setButtonIcon('#emotionButton .emotion-trigger-icon',buttonIcons.emotions);updateModeButtonIcon();setButtonIcon('#generateImageButton',buttonIcons.image_generate);setCreditHeroImage('--credits-toman-hero-image',buttonIcons.hero_toman);setCreditHeroImage('--credits-card-hero-image',buttonIcons.hero_card)}"
          replace_once('src/mini-app/client-original.js', old_apply_icons, new_apply_icons, 'credits hero URL application')

          old_payment_mode = "var head=page&&page.querySelector('.credits-page-head>div:first-child');if(head){var kicker=head.querySelector('span');var title=head.querySelector('h2');var copy=head.querySelector('p');if(kicker)kicker.textContent=next==='toman'?'پرداخت با تومان':'TELEGRAM STARS';if(title)title.textContent=next==='toman'?'کردیت بگیر':'Buy credits';if(copy)copy.textContent=next==='toman'?'مقدارت رو انتخاب کن؛ بقیه‌ش ساده‌ست.':'Top up instantly and keep creating.';head.setAttribute('dir',next==='toman'?'rtl':'ltr')}"
          new_payment_mode = "var head=page&&page.querySelector('.credits-page-head>div:first-child');if(head){var kicker=head.querySelector('span');var title=head.querySelector('h2');if(kicker)kicker.textContent=next==='toman'?'پرداخت با تومان':'TELEGRAM STARS';if(title)title.textContent=next==='toman'?'کردیت بگیر':'Buy credits';head.setAttribute('dir',next==='toman'?'rtl':'ltr')}"
          replace_once('src/mini-app/client-original.js', old_payment_mode, new_payment_mode, 'credits payment header copy')

          # Slider: edit the existing shared control instead of layering a second component.
          old_slider = '.credits-amount-range{width:100%;height:24px;margin:13px 0 0;padding:0;background:transparent;accent-color:#fff;-webkit-appearance:none;appearance:none}.credits-amount-range::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(90deg,#fff 0 var(--credits-range-progress,0%),rgba(255,255,255,.15) var(--credits-range-progress,0%) 100%)}.credits-amount-range::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-7px;border:4px solid #000;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7)}.credits-amount-range::-moz-range-track{height:3px;border-radius:999px;background:rgba(255,255,255,.15)}.credits-amount-range::-moz-range-progress{height:3px;border-radius:999px;background:#fff}.credits-amount-range::-moz-range-thumb{width:10px;height:10px;border:4px solid #000;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7)}'
          new_slider = '@property --credits-range-progress{syntax:"<percentage>";inherits:false;initial-value:0%}.credits-amount-range{--credits-slider-accent:#8b7cf6;width:100%;height:30px;margin:10px 0 0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y;transition:--credits-range-progress .12s cubic-bezier(.22,.8,.22,1)}.credits-amount-range::-webkit-slider-runnable-track{height:2px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.88) 0 var(--credits-range-progress,0%),rgba(255,255,255,.13) var(--credits-range-progress,0%) 100%)}.credits-amount-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border:3px solid #0b0b0c;border-radius:50%;background:var(--credits-slider-accent);box-shadow:0 0 0 1px rgba(139,124,246,.58),0 5px 15px rgba(139,124,246,.16);transition:transform .18s cubic-bezier(.2,.9,.2,1),box-shadow .2s ease}.credits-amount-range:active::-webkit-slider-thumb{transform:scale(1.12);box-shadow:0 0 0 1px rgba(139,124,246,.8),0 7px 18px rgba(139,124,246,.23)}.credits-amount-range::-moz-range-track{height:2px;border-radius:999px;background:rgba(255,255,255,.13)}.credits-amount-range::-moz-range-progress{height:2px;border-radius:999px;background:rgba(255,255,255,.88)}.credits-amount-range::-moz-range-thumb{width:12px;height:12px;border:3px solid #0b0b0c;border-radius:50%;background:var(--credits-slider-accent);box-shadow:0 0 0 1px rgba(139,124,246,.58),0 5px 15px rgba(139,124,246,.16);transition:transform .18s cubic-bezier(.2,.9,.2,1),box-shadow .2s ease}.credits-amount-range:active::-moz-range-thumb{transform:scale(1.12)}'
          replace_once('src/mini-app/styles.js', old_slider, new_slider, 'shared custom credits slider')

          old_toman_slider = '.toman-amount-range{--credits-range-progress:6.06%;direction:ltr;height:24px;margin:13px 0 0;accent-color:#fff}.toman-amount-range::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#fff 0 var(--credits-range-progress),rgba(255,255,255,.15) var(--credits-range-progress) 100%)}.toman-amount-range::-webkit-slider-thumb{width:17px;height:17px;margin-top:-7px;border:4px solid #000;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7)}.toman-amount-range:active::-webkit-slider-thumb{transform:none}.toman-amount-range::-moz-range-track{height:3px;background:rgba(255,255,255,.15)}.toman-amount-range::-moz-range-progress{height:3px;background:#fff}.toman-amount-range::-moz-range-thumb{width:10px;height:10px;border:4px solid #000;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7)}'
          replace_once('src/mini-app/styles.js', old_toman_slider, '.toman-amount-range{--credits-range-progress:6.06%;direction:ltr}', 'Toman slider duplicate overrides')

          old_toman_hero = '.credits-page.toman-payment-active .credits-page-head{background:#000;transition:background .3s ease}.credits-page.toman-payment-active .credits-page-head:before{z-index:-1;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.90) 0%,rgba(0,0,0,.48) 34%,rgba(0,0,0,.04) 66%,rgba(0,0,0,.12) 100%),url(\\"/mini-app/assets/toman-checkout-hero-628cea8287db.png\\") center/cover no-repeat;filter:none;opacity:1}.credits-page.toman-payment-active .credits-page-head:after{height:58px;background:linear-gradient(180deg,transparent,#000)}'
          new_toman_hero = '.credits-page.toman-payment-active .credits-page-head{background:#000 var(--credits-toman-hero-image,url(\\"/mini-app/assets/toman-checkout-hero-628cea8287db.png\\")) 58% center/cover no-repeat;transition:background .3s ease}'
          replace_once('src/mini-app/styles.js', old_toman_hero, new_toman_hero, 'Toman dynamic hero')
          replace_once(
              'src/mini-app/styles.js',
              '\n/* Keep switched Toman artwork above the header background. */\n.credits-page.toman-payment-active .credits-page-head:before{z-index:0;pointer-events:none}.credits-page.toman-payment-active .credits-page-head:after{z-index:1;pointer-events:none}\n',
              '\n',
              'obsolete Toman pseudo hero override',
          )
          replace_once(
              'src/mini-app/styles.js',
              '.credits-page-head p{margin:9px 0 0;color:rgba(255,255,255,.48);font-size:12px;line-height:1.4}',
              '',
              'unused credits header paragraph style',
          )

          # Card checkout: keep Choose your amount, remove only CARD CHECKOUT, and reuse the same hero shell as Stars.
          replace_once(
              'src/mini-app/tribute-payments-client.js',
              '.credits-page.tribute-payment-active .credits-page-head{background:#000!important}\\\n.credits-page.tribute-payment-active .credits-page-head:before,.credits-page.tribute-payment-active .credits-page-head:after{display:none!important}\\\n.credits-page.tribute-payment-active .credits-page-head p{display:none!important}\\\n',
              '.credits-page.tribute-payment-active .credits-page-head{background:#000 var(--credits-card-hero-image,none) 58% center/cover no-repeat!important}\\\n',
              'Bank Card hero shell',
          )
          replace_once(
              'src/mini-app/tribute-payments-client.js',
              '.tribute-section-copy{position:relative;z-index:1}\\\n',
              '.tribute-section-copy{position:relative;z-index:1}\\\n.tribute-section-copy h3{margin-top:0}\\\n',
              'Bank Card title spacing',
          )
          replace_once(
              'src/mini-app/tribute-payments-client.js',
              '<div class=\\"credits-section-copy tribute-section-copy\\"><div><span>CARD CHECKOUT</span><h3>Choose your amount</h3></div></div>',
              '<div class=\\"credits-section-copy tribute-section-copy\\"><div><h3>Choose your amount</h3></div></div>',
              'CARD CHECKOUT label',
          )

          PY

      - name: Verify syntax and intended markers
        shell: bash
        run: |
          node --check src/admin.js
          node --check src/bot.js
          node --check src/mini-app/client-original.js
          node --check src/mini-app/html.js
          node --check src/mini-app/styles.js
          node --check src/mini-app/tribute-payments-client.js
          grep -q 'admin_payment_hero_images' src/bot.js
          grep -q -- '--credits-card-hero-image' src/mini-app/tribute-payments-client.js
          grep -q -- '--credits-toman-hero-image' src/mini-app/styles.js
          ! grep -q '<span>CARD CHECKOUT</span>' src/mini-app/tribute-payments-client.js

      - name: Commit focused changes
        shell: bash
        run: |
          rm .github/workflows/zz-purchase-ui-patch.yml
          git config user.name 'vexaaiv[bot]'
          git config user.email 'vexaaiv[bot]@users.noreply.github.com'
          git add src/admin.js src/bot.js src/mini-app/client-original.js src/mini-app/html.js src/mini-app/styles.js src/mini-app/tribute-payments-client.js .github/workflows/zz-purchase-ui-patch.yml
          git commit -m 'Improve purchase UI and payment hero controls'
          git push origin HEAD:main
