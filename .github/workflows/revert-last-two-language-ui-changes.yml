name: Revert last two language UI changes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/revert-last-two-language-ui-changes.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore client exactly before the last two UI changes
        run: |
          git checkout e5fc8a4ff8b8ffba2c7bbbff445a9ae55ee29652 -- src/mini-app/client.js

      - name: Validate restored file
        run: |
          node --check src/mini-app/client.js
          npm test
          git diff --check

      - name: Commit exact revert and remove temporary workflow
        run: |
          rm -f .github/workflows/revert-last-two-language-ui-changes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mini-app/client.js .github/workflows/revert-last-two-language-ui-changes.yml
          git diff --cached --check
          git commit -m "Revert last two demo language UI changes"
          git push origin HEAD:main
