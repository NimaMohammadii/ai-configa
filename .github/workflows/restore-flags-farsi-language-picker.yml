name: Restore flags and Farsi language picker state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-flags-farsi-language-picker.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore exact client version with flags and Farsi
        run: |
          git checkout 2131134dc2532c2884f79851dcdcdb066e553ea7 -- src/mini-app/client.js

      - name: Validate exact restored file
        run: |
          node --check src/mini-app/client.js
          npm test
          git diff --check

      - name: Commit restore and remove temporary workflow
        run: |
          rm -f .github/workflows/restore-flags-farsi-language-picker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mini-app/client.js .github/workflows/restore-flags-farsi-language-picker.yml
          git diff --cached --check
          git commit -m "Restore language flags and Farsi picker state"
          git push origin HEAD:main
